name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # hey emits the 404 page as /404/index.html, but Pages only serves
      # a custom 404 from /404.html at the root.
      - name: Add root 404
        run: cp public/404/index.html public/404.html

      # hey only copies image/js/css assets out of templates/, so the
      # custom-domain file has to be written here.
      - name: Add CNAME
        run: echo benhoad.net > public/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
